# Local SAST rules. In CI we also use the public registry packs (p/python, p/flask);
# these local rules show how a SAST rule is written and work fully offline.
rules:
  - id: hardcoded-secret
    languages: [python]
    severity: ERROR
    message: Hard-coded secret in source code. Load it from a secret manager or environment variable.
    metadata: { cwe: "CWE-798", owasp: "A07:2021 Identification and Authentication Failures" }
    pattern-either:
      - pattern: $APP.config["SECRET_KEY"] = "..."
      - patterns:
          - pattern: $NAME = "..."
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(password|secret|token|api_key).*

  - id: sql-injection-string-concat
    languages: [python]
    severity: ERROR
    message: SQL query built by string concatenation with user input. Use parameterised queries.
    metadata: { cwe: "CWE-89", owasp: "A03:2021 Injection" }
    patterns:
      - pattern-either:
          - pattern: |
              $Q = "..." + $X + "..."
              ...
              $DB.execute($Q)
          - pattern: $DB.execute("..." + $X + "...")

  - id: command-injection-shell-true
    languages: [python]
    severity: ERROR
    message: subprocess called with shell=True and a dynamic command. Pass a list and avoid the shell.
    metadata: { cwe: "CWE-78", owasp: "A03:2021 Injection" }
    patterns:
      - pattern: subprocess.$F($CMD, ..., shell=True, ...)
      - pattern-not: subprocess.$F("...", ..., shell=True, ...)

  - id: flask-reflected-xss
    languages: [python]
    severity: WARNING
    message: User input returned in HTML without escaping (reflected XSS). Use templates with auto-escaping.
    metadata: { cwe: "CWE-79", owasp: "A03:2021 Injection" }
    patterns:
      - pattern-inside: |
          $V = request.args.get(...)
          ...
      - pattern: return "..." + $V + "..."

  - id: flask-debug-enabled
    languages: [python]
    severity: WARNING
    message: Flask debug mode enabled. It exposes an interactive debugger that allows code execution.
    metadata: { cwe: "CWE-489", owasp: "A05:2021 Security Misconfiguration" }
    pattern: $APP.run(..., debug=True, ...)
